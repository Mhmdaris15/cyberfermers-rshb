# =====================================================================
#  PRODUCTION compose file — full containerised stack.
#  Run with:  docker compose -f docker-compose.prod.yml up -d --build
#
#  Reads its config from .env.production (NOT .env).
#
#  Services:
#    surrealdb  — persistent KV store on a named volume
#    api        — Go binary, no host bind mounts
#    web        — Vite static build behind nginx (proxies /api → api:8080)
#
#  No service publishes a host port. The platform's reverse proxy
#  (Coolify Traefik / Cloudify-managed Caddy / external Nginx) is
#  expected to attach to `svoe-net-prod` and route :80/:443 to the
#  `web` container. To run this stack standalone (no platform proxy),
#  re-add `ports: ["${WEB_PORT:-8080}:80"]` to the web service.
# =====================================================================

name: svoe-rodnoe-prod

services:
  surrealdb:
    image: surrealdb/surrealdb:v2.1.4
    container_name: svoe-surreal-prod
    restart: unless-stopped
    user: "0:0"
    command:
      - start
      - --user
      - ${SURREAL_USER:?SURREAL_USER must be set}
      - --pass
      - ${SURREAL_PASS:?SURREAL_PASS must be set}
      - --bind
      - 0.0.0.0:8000
      - rocksdb:/data/svoe.db
    expose:
      - "8000"            # internal-only; do NOT publish to the host
    volumes:
      - surreal_data:/data
    networks: [svoe-net]
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--conn", "http://localhost:8000"]
      interval: 60s
      retries: 30
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: svoe-api-prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      # Pinned here (not from env_file) so Coolify/platform env injection
      # cannot override the listen port the healthcheck targets.
      # `environment:` has higher precedence than `env_file:` in compose.
      API_PORT: "8080"
      # Override the host-side defaults so the API talks to the DB by service name.
      SURREAL_URL: http://surrealdb:8000
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-https://localhost}
      # Schema and seed files are baked into the image at /app/data — point env there.
      SCHEMA_PATH: /app/infrastructure/surrealdb/schema.surql
      EVENTS_YAML_PATH: /app/data/seed/events.yml
      AUDIENCES_YAML_PATH: /app/data/seed/audiences.yml
      TRENDS_YAML_PATH: /app/data/seed/trends.yml
      SEASONAL_WINDOWS_YAML_PATH: /app/data/seed/seasonal_windows.yml
      XLSX_PATH: /app/data/raw/farmers_sku.xlsx
    expose:
      - "8080"            # reachable from web (svoe-net) and Coolify's Traefik
    depends_on:
      surrealdb:
        condition: service_healthy
    # IMPORTANT: do NOT pin this service's networks list to include `coolify`
    # explicitly. Coolify auto-attaches its proxy network to services that
    # have a UI-configured domain, and a hand-written networks list overrides
    # that auto-injection, breaking the api subdomain routing. Keep this on
    # svoe-net only — web (same-origin reverse-proxy) reaches us here, and
    # Coolify wires its own proxy onto this container at deploy time.
    networks: [svoe-net]
    # Tell Traefik the API speaks on 8080. Without this label Traefik
    # defaults its loadbalancer to :80 (no listener on this container)
    # and every request times out as 504 even when the container is
    # healthy and reachable over Docker DNS. Coolify's auto-injected
    # router for this service's domain will reuse this service.
    labels:
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://localhost:8080/health
      interval: 60s
      timeout: 3s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # NOTE: The DevOps Operator (apps/devops/) is intentionally NOT included
  # in this production compose. It is a separate concern with its own auth
  # surface and threat model; deploy it independently via apps/devops/README.md
  # so it doesn't run in the same trust boundary as the public-facing stack.

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        # Vite injects this at BUILD time, not runtime. Bake it to whatever
        # public URL terminates TLS in front of the stack. For same-origin
        # deploys (recommended), leave empty so the FE uses relative /api.
        VITE_API_URL: ${PUBLIC_API_URL:-}
        VITE_APP_NAME: ${PUBLIC_APP_NAME:-Свое Родное · Calendar}
    container_name: svoe-web-prod
    restart: unless-stopped
    # No `ports:` binding — Coolify's Traefik proxy already owns host
    # 80/443 and routes to this container via the Docker network. Use
    # `expose:` so siblings on svoe-net can reach :80 without competing
    # for a host port. If you deploy this stack OUTSIDE Coolify, you'll
    # need to re-add `ports: ["${WEB_PORT:-8080}:80"]` or run your own
    # reverse proxy in front.
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    # Attach to BOTH networks:
    #   - svoe-net      → talk to the api service by name (api:8080)
    #   - coolify       → let Coolify's Traefik proxy reach this container.
    # The coolify network is declared as `external` below; the platform creates
    # it once at install time. Without this attachment Traefik is on a
    # different bridge and the upstream dial times out → Cloudflare 504.
    networks: [svoe-net, coolify]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/"]
      interval: 60s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  surreal_data:
    name: svoe_surreal_data_prod

networks:
  svoe-net:
    name: svoe-net-prod
    driver: bridge
  # Pre-existing network owned by Coolify itself — created during Coolify
  # install. We attach the web service to it so the platform's Traefik proxy
  # can route inbound traffic without needing a host port binding.
  # If your Coolify install uses a different proxy network name (some older
  # builds use `coolify-proxy`), change `name:` below to match.
  coolify:
    external: true
    name: coolify
