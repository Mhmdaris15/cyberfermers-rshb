# =====================================================================
#  PRODUCTION compose file — full containerised stack.
#  Run with:  docker compose -f docker-compose.prod.yml up -d
#
#  Reads its config from .env.production (NOT .env).
#
#  Services:
#    surrealdb  — persistent KV store on a named volume
#    api        — Go binary, pulled from GHCR (no host bind mounts)
#    web        — Vite static build behind nginx (proxies /api → api:8080),
#                 pulled from GHCR
#
#  Image source (build → registry):
#    Images are built by .github/workflows/build-and-push.yml on every
#    push to main, and pushed to GHCR. Coolify (or any docker host) only
#    needs `docker pull` + recreate — NO source checkout, NO local build.
#
#    Override the tag at deploy time via env vars in .env.production:
#       API_IMAGE=ghcr.io/<owner>/<repo>-api:sha-abc1234
#       WEB_IMAGE=ghcr.io/<owner>/<repo>-web:sha-abc1234
#    Defaults below pin to `:latest` — pinning to a SHA tag is safer
#    for rollbacks because it's immutable.
#
#  Coolify orchestration rules (the reason this file looks "bare"):
#    - NO top-level `name:`         — Coolify owns the compose project name.
#    - NO `container_name:`         — Coolify generates per-deploy names.
#    - NO manual Traefik labels     — Coolify auto-injects routing labels
#                                     based on the UI-configured domains.
#    - NO `name:` on networks       — Docker autogenerates the bridge name,
#                                     scoped to this Coolify project so other
#                                     deployments cannot collide with it.
#    - Only `web` joins external `coolify` network for Traefik ingress;
#      `api` and `surrealdb` stay on the internal bridge.
#
#  To run this stack standalone (no Coolify), re-add
#  `ports: ["${WEB_PORT:-8080}:80"]` to the web service.
# =====================================================================

services:
  surrealdb:
    image: surrealdb/surrealdb:v2.1.4
    restart: unless-stopped
    user: "0:0"
    command:
      - start
      - --user
      - ${SURREAL_USER:?SURREAL_USER must be set}
      - --pass
      - ${SURREAL_PASS:?SURREAL_PASS must be set}
      - --bind
      - 0.0.0.0:8000
      - rocksdb:/data/svoe.db
    expose:
      - "8000"            # internal-only; do NOT publish to the host
    volumes:
      - surreal_data:/data
    networks: [svoe-net]
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--conn", "http://localhost:8000"]
      interval: 60s
      retries: 30
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    # Pre-built image from GHCR — see .github/workflows/build-and-push.yml.
    # Override API_IMAGE in .env.production to pin a specific SHA tag for
    # atomic rollbacks (e.g. ghcr.io/owner/repo-api:sha-abc1234).
    image: ${API_IMAGE:-ghcr.io/mhmdaris15/cyberfermers-rshb-api:latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env.production
    environment:
      # Pinned here (not from env_file) so Coolify/platform env injection
      # cannot override the listen port the healthcheck targets.
      # `environment:` has higher precedence than `env_file:` in compose.
      API_PORT: "8080"
      # Override the host-side defaults so the API talks to the DB by service name.
      SURREAL_URL: http://surrealdb:8000
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-https://localhost}
      # Schema and seed files are baked into the image at /app/data — point env there.
      SCHEMA_PATH: /app/infrastructure/surrealdb/schema.surql
      EVENTS_YAML_PATH: /app/data/seed/events.yml
      AUDIENCES_YAML_PATH: /app/data/seed/audiences.yml
      TRENDS_YAML_PATH: /app/data/seed/trends.yml
      SEASONAL_WINDOWS_YAML_PATH: /app/data/seed/seasonal_windows.yml
      XLSX_PATH: /app/data/raw/farmers_sku.xlsx
    expose:
      - "8080"            # reachable from web (svoe-net) and Coolify's Traefik
    depends_on:
      surrealdb:
        condition: service_healthy
    # Internal-only: Coolify auto-attaches its proxy network to any
    # service that has a UI-configured domain. Configure the API's
    # subdomain in the Coolify UI; do NOT hand-write the `coolify`
    # network here or it overrides Coolify's auto-injection.
    networks: [svoe-net]
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://localhost:8080/health
      interval: 60s
      timeout: 3s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # NOTE: The DevOps Operator (apps/devops/) is intentionally NOT included
  # in this production compose. It is a separate concern with its own auth
  # surface and threat model; deploy it independently via apps/devops/README.md
  # so it doesn't run in the same trust boundary as the public-facing stack.

  web:
    # Pre-built image from GHCR. VITE_API_URL / VITE_APP_NAME are baked
    # in at BUILD time inside the CI workflow — set them as repo
    # Variables in GitHub (Settings → Secrets and variables → Variables)
    # if you need non-defaults. Same-origin deploys want VITE_API_URL=""
    # so the FE uses relative /api (proxied by nginx to the api service).
    image: ${WEB_IMAGE:-ghcr.io/mhmdaris15/cyberfermers-rshb-web:latest}
    pull_policy: always
    restart: unless-stopped
    # No `ports:` binding — Coolify's Traefik proxy already owns host
    # 80/443 and routes to this container via the Docker network. Use
    # `expose:` so siblings on svoe-net can reach :80 without competing
    # for a host port. If you deploy this stack OUTSIDE Coolify, you'll
    # need to re-add `ports: ["${WEB_PORT:-8080}:80"]` or run your own
    # reverse proxy in front.
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    # Attach to BOTH networks:
    #   - svoe-net      → talk to the api service by name (api:8080)
    #   - coolify       → let Coolify's Traefik proxy reach this container.
    # The coolify network is declared as `external` below; the platform creates
    # it once at install time. Without this attachment Traefik is on a
    # different bridge and the upstream dial times out → Cloudflare 504.
    networks: [svoe-net, coolify]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/"]
      interval: 60s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  surreal_data:
    name: svoe_surreal_data_prod

networks:
  # Internal bridge for service-to-service traffic. Intentionally
  # unnamed — Docker autogenerates a project-scoped name, so two
  # Coolify deployments of this stack cannot collide on the network
  # name even when both happen to be running.
  svoe-net:
    driver: bridge
  # Pre-existing network owned by Coolify itself — created during Coolify
  # install. We attach the web service to it so the platform's Traefik proxy
  # can route inbound traffic without needing a host port binding.
  # If your Coolify install uses a different proxy network name (some older
  # builds use `coolify-proxy`), change `name:` below to match.
  coolify:
    external: true
    name: coolify
