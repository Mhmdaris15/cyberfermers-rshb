server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security hardening — drop server signature, set conservative headers.
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── Reverse proxy → API ────────────────────────────────────────
  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # The /stream endpoint emits Server-Sent Events. Buffering MUST be off
    # so each `event: …\ndata: …\n\n` block reaches the browser immediately.
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    chunked_transfer_encoding on;
  }

  # Long-lived asset cache. Vite emits hashed filenames so this is safe.
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|gif|ico)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Liveness target for the container HEALTHCHECK.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Avoid serving the index.html itself from the long cache.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    expires off;
  }
}
